# Controlli automatici a ogni push e a ogni pull request:
# link rotti, QR, link diretti, progressi salvati, fotografia dei giochi e schermate (Playwright).
# Le schermate restano scaricabili per qualche giorno come artefatto "schermate" dell'esecuzione.
name: Controlli

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  controlli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: schermate
          path: tests/risultati/
          retention-days: 14
