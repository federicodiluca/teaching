<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Problemi classici passo passo</title><style>body.tg-pp{margin:0}
.tg-pp .pp-top{padding:1rem max(16px,env(safe-area-inset-right,0px)) .3rem max(16px,env(safe-area-inset-left,0px));max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:baseline;gap:.3rem 1rem}
.tg-pp .pp-top h1{font-size:clamp(1.4rem,2.6vw,1.9rem);margin:0}
.tg-pp .pp-top p{margin:0;color:var(--tg-mute)}
.tg-pp main{padding:0 max(16px,env(safe-area-inset-right,0px)) 2rem max(16px,env(safe-area-inset-left,0px));max-width:1400px;margin:0 auto}
.pp-scen{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.pp-scen button{font:inherit;padding:.45rem .9rem;border-radius:999px;border:1px solid var(--tg-line-2);background:var(--tg-paper);color:var(--tg-ink);cursor:pointer;min-height:44px}
.pp-scen button[aria-pressed=true]{background:var(--tg-acc-soft);border-color:var(--tg-acc);font-weight:600}
.pp-desc{max-width:80ch;margin:.4rem 0 .8rem;line-height:1.5}
.pp-ctl{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem}
.pp-btn{font:inherit;font-weight:600;min-height:46px;padding:.5rem 1.1rem;border-radius:10px;border:1px solid var(--tg-acc);background:var(--tg-acc);color:var(--tg-on-acc);cursor:pointer}
.pp-btn.sec{background:var(--tg-paper-2);color:var(--tg-ink);border-color:var(--tg-line-2)}
.pp-btn:disabled{opacity:.45;cursor:default}
#pp-passo{color:var(--tg-mute);font-variant-numeric:tabular-nums;margin-left:auto}
.pp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:1rem;align-items:start}
@media(max-width:900px){.pp-grid{grid-template-columns:minmax(0,1fr)}}
.pp-procs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.8rem}
.pp-p{background:var(--tg-paper);border:1px solid var(--tg-line);border-radius:12px;padding:.7rem .8rem;display:flex;flex-direction:column;gap:.4rem;box-shadow:var(--tg-shadow-sm);min-width:0}
.pp-p.bloccato{border-color:var(--tg-warn)}
.pp-p.finito{opacity:.6}
.pp-ph{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:1.15rem}
.pp-b{font-size:.78rem;font-weight:600;padding:.15rem .5rem;border-radius:999px;white-space:nowrap}
.pp-b.pro{background:var(--tg-acc-soft);color:var(--tg-ink)}
.pp-b.blo{background:var(--tg-warn-soft);color:var(--tg-warn)}
.pp-b.sc{background:var(--tg-hl-soft);color:var(--tg-ink)}
.pp-b.fin{background:var(--tg-paper-2);color:var(--tg-mute)}
.pp-giro{font-size:.8rem;color:var(--tg-mute)}
.pp-code{list-style:none;margin:0;padding:0;font-family:var(--tg-mono);font-size:.92rem;display:grid;gap:2px}
.pp-code li{padding:.2rem .45rem;border-radius:6px;border-left:3px solid transparent;overflow-wrap:anywhere}
.pp-code li.sc{border-left-color:var(--tg-hl)}
.pp-code li.last{color:var(--tg-mute)}
.pp-code li.cur{background:var(--tg-acc-soft);font-weight:700;color:var(--tg-ink)}
.pp-code li.cur::before{content:"▶ ";color:var(--tg-acc)}
.pp-p.bloccato .pp-code li.cur{background:var(--tg-warn-soft)}
.pp-loc{font-family:var(--tg-mono);font-size:.85rem;color:var(--tg-mute)}
.pp-go{font:inherit;font-weight:600;margin-top:auto;min-height:44px;border-radius:9px;border:1px solid var(--tg-line-2);background:var(--tg-paper-2);color:var(--tg-ink);cursor:pointer}
.pp-go:not(:disabled):hover{border-color:var(--tg-acc)}
.pp-go:disabled{opacity:.4;cursor:default}
.pp-go kbd{font-family:var(--tg-mono);font-size:.75rem;border:1px solid var(--tg-line-2);border-radius:4px;padding:0 .3rem;color:var(--tg-mute)}
.pp-side{background:var(--tg-paper);border:1px solid var(--tg-line);border-radius:12px;padding:.8rem;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.pp-side h2{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tg-mute);margin:.3rem 0 0}
.pp-s{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 .6rem;padding:.45rem .6rem;border-radius:9px;border:1px solid var(--tg-line)}
.pp-s.verde{background:var(--tg-ok-soft)}
.pp-s.rosso{background:var(--tg-ko-soft)}
.pp-sn{font-family:var(--tg-mono);font-weight:600}
.pp-sv{font-family:var(--tg-mono);font-size:1.5rem;font-weight:700;grid-row:span 2;font-variant-numeric:tabular-nums}
.pp-s.verde .pp-sv{color:var(--tg-ok)}
.pp-s.rosso .pp-sv{color:var(--tg-ko)}
.pp-sc{font-size:.82rem;color:var(--tg-mute)}
.pp-var{display:flex;justify-content:space-between;gap:.5rem;font-family:var(--tg-mono)}
.pp-msg p{margin:.3rem 0;padding:.5rem .6rem;border-radius:8px;font-weight:600;line-height:1.35}
.pp-msg p.ko{background:var(--tg-ko-soft);color:var(--tg-ko)}
.pp-msg p.ok{background:var(--tg-ok-soft);color:var(--tg-ok)}
.pp-log{margin:0;padding-left:1.1rem;font-size:.85rem;color:var(--tg-mute);display:grid;gap:.2rem}
.pp-log li:first-child{color:var(--tg-ink);font-weight:600}
.pp-cells{display:flex;gap:.3rem;flex-wrap:wrap}
.pp-cell{min-width:3.2rem;text-align:center;padding:.35rem;border:1px solid var(--tg-line-2);border-radius:8px;font-family:var(--tg-mono);background:var(--tg-paper-2)}
.pp-cell.piena{background:var(--tg-acc-soft);border-color:var(--tg-acc)}
.pp-cell small{display:block;color:var(--tg-mute);font-size:.7rem;min-height:1em}</style><link rel="icon" href="../../../assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../../assets/teaching.css"><script src="../../../assets/catalogo.js" defer></script><script src="../../../assets/teaching.js" defer></script></head><body class="tg-lim tg-pp"><header class="pp-top"><h1>Problemi classici passo passo</h1><p>Buffer circolare, lettori e scrittori, filosofi e deadlock: siete voi lo scheduler.</p></header><main></main><script src="../../temi/passo-passo.js"></script><script>
const cel=(v,dim)=>`<div class="pp-cells">${v.buf.map((x,i)=>`<div class="pp-cell ${x?'piena':''}"><small>${[i===v.metti?'metti':'',i===v.togli?'togli':''].filter(Boolean).join(' ')}</small>${x||'—'}</div>`).join('')}</div><div class="pp-var"><span>letti</span><b>${v.letti.join(', ')||'nessuno'}</b></div>`;
const dueDati=v=>v.buf.filter(Boolean).length===2?['ok','Nel buffer ci sono entrambi i dati, in due celle diverse.']:['ko',`Nel buffer c'è un solo dato invece di due: uno è andato perso.`];
const prodDato={t:'produce un dato',f:(v,L,p)=>{v.n[p]=(v.n[p]||0)+1;L.dato=p[0]+v.n[p]}};
const scriviCella=k=>({t:`buffer[${k}] = dato`,f:(v,L)=>{const i=k==='metti'?v.metti:L.tempo;const r=v.buf[i]?['ko',`Cella ${i} sovrascritta: il dato ${v.buf[i]} è andato perso.`]:null;v.buf[i]=L.dato;return r}});
const leggiCella={t:'dato = buffer[togli]',f:(v,L)=>{const x=v.buf[v.togli];if(!x)return['ko',`Il consumatore legge la cella ${v.togli}, che è vuota.`];L.dato=x;v.letti.push(x);v.buf[v.togli]=null}};
const filosofi=tot=>[0,1,2,3,4].map(i=>{const s='f'+i,d='f'+((i+1)%5);
 return{nome:'F'+(i+1),code:tot?[{t:'pensa'},{PP:[s,d],t:`prende ${s} e ${d} insieme`},{t:'mangia'},{V:s},{V:d}]
  :[{t:'pensa'},{P:s,t:`P(${s}) sinistra`},{P:d,t:`P(${d}) destra`},{t:'mangia'},{V:s},{V:d}]}});
const lettore=n=>({nome:n,rip:2,code:[{P:'mutex'},{t:'numLettori++',f:v=>{v.numLettori++}},{P:'sincro',se:v=>v.numLettori===1,t:'if (numLettori == 1) P(sincro)'},{V:'mutex'},
 {t:'legge',f:(v,L,p)=>{if(v.scrive)return['ko',`${p} legge mentre ${v.scrive} scrive!`];v.leggono.push(p)}},{t:'finisce di leggere',f:(v,L,p)=>{v.leggono=v.leggono.filter(x=>x!==p)}},
 {P:'mutex'},{t:'numLettori--',f:v=>{v.numLettori--}},{V:'sincro',se:v=>v.numLettori===0,t:'if (numLettori == 0) V(sincro)'},{V:'mutex'}]});
SIM({scenari:[
 {id:'buffer-circolare',nome:'Buffer circolare',
  desc:'Buffer da 3 celle: vuoto parte da 3 e pieno da 0. Il produttore può depositare fino a tre dati prima che il consumatore legga; poi si ferma su P(vuoto).',
  sem:{vuoto:3,pieno:0},vars:{buf:[null,null,null],metti:0,togli:0,letti:[],n:{}},
  procs:[{nome:'Produttore',rip:4,code:[prodDato,{P:'vuoto'},scriviCella('metti'),{t:'metti = (metti + 1) % 3',f:v=>{v.metti=(v.metti+1)%3}},{V:'pieno'}]},
         {nome:'Consumatore',rip:4,code:[{P:'pieno'},leggiCella,{t:'togli = (togli + 1) % 3',f:v=>{v.togli=(v.togli+1)%3}},{V:'vuoto'},{t:'consuma il dato'}]}],vista:cel},
 {id:'due-produttori',nome:'Due produttori senza mutexP',
  desc:'Due produttori, un dato ciascuno, condividono l\'indice metti senza proteggerlo. Fate eseguire «tempo = metti» a entrambi prima che uno dei due aggiorni metti: in quale cella scrivono?',
  sem:{vuoto:3,pieno:0},vars:{buf:[null,null,null],metti:0,togli:0,letti:[],n:{}},
  procs:[...['P','Q'].map(n=>({nome:n,code:[prodDato,{P:'vuoto'},{t:'tempo = metti',f:(v,L)=>{L.tempo=v.metti}},{t:'metti = (metti + 1) % 3',f:v=>{v.metti=(v.metti+1)%3}},scriviCella('tempo'),{V:'pieno'}]})),],vista:cel,fine:dueDati},
 {id:'con-mutexp',nome:'Due produttori con mutexP',
  desc:'Lo stesso codice, con P(mutexP) e V(mutexP) attorno all\'aggiornamento dell\'indice: ognuno si riserva una cella diversa. La scrittura nella cella resta fuori dalla regione critica, come nelle slide.',
  sem:{vuoto:3,pieno:0,mutexP:1},vars:{buf:[null,null,null],metti:0,togli:0,letti:[],n:{}},
  procs:[...['P','Q'].map(n=>({nome:n,code:[prodDato,{P:'vuoto'},{P:'mutexP'},{t:'tempo = metti',f:(v,L)=>{L.tempo=v.metti}},{t:'metti = (metti + 1) % 3',f:v=>{v.metti=(v.metti+1)%3}},{V:'mutexP'},scriviCella('tempo'),{V:'pieno'}]})),],vista:cel,fine:dueDati},
 {id:'lettori-scrittori',nome:'Lettori e scrittori',
  desc:'Prima soluzione: il primo lettore blocca sincro, l\'ultimo lo libera. Fate entrare un lettore, poi provate a far scrivere S mentre altri lettori continuano ad arrivare: lo scrittore rischia la starvation.',
  sem:{mutex:1,sincro:1},vars:{numLettori:0,leggono:[],scrive:null},
  procs:[lettore('L1'),lettore('L2'),{nome:'S',code:[{P:'sincro'},{t:'scrive',f:(v,L,p)=>{if(v.leggono.length)return['ko',`${p} scrive mentre qualcuno legge!`];v.scrive=p}},{t:'finisce di scrivere',f:v=>{v.scrive=null}},{V:'sincro'}]}],
  vista:v=>`<div class="pp-var"><span>numLettori</span><b>${v.numLettori}</b></div><div class="pp-var"><span>stanno leggendo</span><b>${v.leggono.join(', ')||'nessuno'}</b></div><div class="pp-var"><span>sta scrivendo</span><b>${v.scrive||'nessuno'}</b></div>`},
 {id:'filosofi',nome:'Filosofi a cena',
  desc:'Ogni filosofo prende prima la forchetta di sinistra e poi quella di destra. Fate eseguire a tutti «pensa» e la prima P: che cosa succede?',
  sem:{f0:1,f1:1,f2:1,f3:1,f4:1},vars:{},procs:filosofi(false)},
 {id:'filosofi-insieme',nome:'Filosofi con allocazione totale',
  desc:'Ora ogni filosofo prende le due forchette insieme, solo se sono libere entrambe: nessuno resta con una forchetta in mano. Lo stallo non si può più verificare.',
  sem:{f0:1,f1:1,f2:1,f3:1,f4:1},vars:{},procs:filosofi(true)},
 {id:'due-risorse',nome:'Due risorse in ordine opposto',
  desc:'A prende R1 e poi R2, B prende R2 e poi R1. Fate eseguire la prima istruzione a entrambi.',
  sem:{R1:1,R2:1},vars:{},procs:[{nome:'A',code:[{P:'R1'},{P:'R2'},{t:'usa R1 e R2'},{V:'R2'},{V:'R1'}]},{nome:'B',code:[{P:'R2'},{P:'R1'},{t:'usa R1 e R2'},{V:'R1'},{V:'R2'}]}]},
 {id:'due-risorse-ordinate',nome:'Due risorse nello stesso ordine',
  desc:'Allocazione gerarchica: tutti prendono prima R1 e poi R2. L\'attesa circolare non può più formarsi.',
  sem:{R1:1,R2:1},vars:{},procs:['A','B'].map(n=>({nome:n,code:[{P:'R1'},{P:'R2'},{t:'usa R1 e R2'},{V:'R2'},{V:'R1'}]}))}
]});
</script></body></html>
